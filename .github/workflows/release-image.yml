name: Release Image

# Publishes a versioned image to GHCR whenever a GitHub Release is
# published — the counterpart to Dev Image (dev-image.yml), but for
# tagged releases instead of every commit:
#
#   ghcr.io/x3n0n10/stream-share-dashboard:<tag>    (e.g. v1.0, exact match to the release tag)
#   ghcr.io/x3n0n10/stream-share-dashboard:latest   (floating - always the most recent non-prerelease)
#
# Uses the repo's built-in GITHUB_TOKEN — no secrets to configure.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)publish, e.g. v1.0'
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set release tag
        run: echo "RELEASE_TAG=${{ github.event.release.tag_name || inputs.tag }}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push version-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prereleases get their own version tag above but shouldn't become
      # :latest — manual runs (no prerelease info available) always do.
      - name: Move floating :latest tag
        if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ env.RELEASE_TAG }}
